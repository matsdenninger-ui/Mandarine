name: Build Zytrus

on:
  push:
    branches-ignore: [zytrus-exe]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter Zytrus.csproj | Select-Object -First 1
          if (-not $proj) { throw "Zytrus.csproj nicht gefunden - wurde der Ordner src hochgeladen?" }
          dotnet publish $proj.FullName -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o publish/${{ matrix.rid }}

      # The license notices must travel with the exe.
      - name: Add license notices
        shell: pwsh
        run: Copy-Item THIRD-PARTY-NOTICES.txt publish/${{ matrix.rid }}/

      - uses: actions/upload-artifact@v4
        with:
          name: Zytrus-${{ matrix.rid }}
          path: |
            publish/${{ matrix.rid }}/Zytrus.exe
            publish/${{ matrix.rid }}/THIRD-PARTY-NOTICES.txt

      # Also keep the latest x64 exe on the branch "zytrus-exe", so it can be fetched with plain git.
      - name: Put exe on branch zytrus-exe
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory exe-out | Out-Null
          Copy-Item publish/win-x64/Zytrus.exe exe-out/
          Copy-Item THIRD-PARTY-NOTICES.txt exe-out/
          Set-Location exe-out
          git init -q -b zytrus-exe
          git add Zytrus.exe THIRD-PARTY-NOTICES.txt
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Zytrus.exe from ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" zytrus-exe
