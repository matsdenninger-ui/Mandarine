name: Build Mandarine

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter Mandarine.csproj | Select-Object -First 1
          if (-not $proj) { throw "Mandarine.csproj nicht gefunden - wurde der Ordner src hochgeladen?" }
          dotnet publish $proj.FullName -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o publish/${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: Mandarine-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/Mandarine.exe
